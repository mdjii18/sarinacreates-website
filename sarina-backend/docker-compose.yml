version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sarinacreates-db
    restart: always
    environment:
      POSTGRES_DB: sarinacreates
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: sarinacreates-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/sarinacreates
    depends_on:
      - postgres

volumes:
  postgres_data:
