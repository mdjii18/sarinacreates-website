# Server Configuration
server.port=${PORT:3000}

# Static resource caching — disable so browsers always get the latest HTML/CSS/JS
spring.web.resources.cache.cachecontrol.no-cache=true
spring.web.resources.cache.cachecontrol.must-revalidate=true

# Application Name
spring.application.name=sarina-backend

# Multipart file upload limits (15MB per file for base64 resin images)
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

# JPA & Hibernate configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# Database Configuration (PostgreSQL with fallback or dynamic environment)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sarinacreates}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP — keep Neon DB connection warm (prevents 2-3s cold start every 5 min)
spring.datasource.hikari.keepalive-time=240000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
