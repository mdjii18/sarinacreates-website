<script>
  document.getElementById('yr').textContent = new Date().getFullYear();

  async function render() {
    const lines = await SC.cartLines();
    const linesEl = document.getElementById('lines');
    const summaryEl = document.getElementById('summary');

    if (!lines.length) {
      linesEl.innerHTML = `<div class="empty-state"><h3>Your cart is empty</h3><p>Take a look through the shop — every piece is one of a kind.</p><a class="btn btn-primary" href="shop.html">Browse the shop</a></div>`;
      summaryEl.innerHTML = '';
      return;
    }

    linesEl.innerHTML = lines.map(l => `
      <div class="cart-line">
        <div class="art-tile" data-art="${l.id}"></div>
        <div>
          <h3 style="margin:0 0 4px;font-size:1rem;">${l.product.name}</h3>
          <div class="dims">${l.product.dims}</div>
        </div>
        <div class="qty">
          <button type="button" data-dec="${l.id}">−</button>
          <input type="text" value="${l.qty}" readonly>
          <button type="button" data-inc="${l.id}" ${l.qty >= l.product.stock ? 'disabled' : ''}>+</button>
        </div>
        <div style="text-align:right;">
          <div class="price">${SC.money(l.product.price * l.qty)}</div>
          <button type="button" class="btn btn-ghost btn-sm" style="margin-top:8px;border:none;color:#9C4222;" data-remove="${l.id}">Remove</button>
        </div>
      </div>`).join('');

    const total = await SC.cartTotal();
    summaryEl.innerHTML = `
      <div class="summary-row"><span>Subtotal</span><span>${SC.money(total)}</span></div>
      <div class="summary-row"><span>Shipping</span><span>Calculated at checkout</span></div>
      <div class="summary-row total"><span>Total</span><span>${SC.money(total)}</span></div>
      <a href="checkout.html" class="btn btn-primary btn-block" style="margin-top:18px;">Go to checkout</a>
      <p class="hint" style="margin-top:14px;">Payment is arranged directly with the studio after you confirm your order — no card details are collected here.</p>`;

    linesEl.querySelectorAll('[data-inc]').forEach(b => b.addEventListener('click', async () => {
      const id = b.getAttribute('data-inc');
      const line = SC.getCart().find(l => l.id === id);
      const product = await SC.getProduct(id);
      SC.updateCartQty(id, Math.min(product.stock, line.qty + 1));
      SC.updateNav(); render();
    }));
    linesEl.querySelectorAll('[data-dec]').forEach(b => b.addEventListener('click', () => {
      const id = b.getAttribute('data-dec');
      const line = SC.getCart().find(l => l.id === id);
      SC.updateCartQty(id, line.qty - 1);
      SC.updateNav(); render();
    }));
    linesEl.querySelectorAll('[data-remove]').forEach(b => b.addEventListener('click', () => {
      SC.removeFromCart(b.getAttribute('data-remove'));
      SC.updateNav(); render();
    }));
    SC.renderTilesOnPage();
  }
  document.addEventListener('DOMContentLoaded', render);
</script>
