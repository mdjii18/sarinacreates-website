<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio login — sarinacreates</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../css/style.css">
</head>
<body style="background:var(--teal);min-height:100vh;">

<main style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;">
  <div class="form-panel">
    <a href="../index.html" class="brand" style="justify-content:center;margin-bottom:18px;">sarina<span class="dot">·</span>creates</a>
    <span class="eyebrow" style="display:block;text-align:center;">Studio access</span>
    <h1 style="font-size:1.5rem;text-align:center;margin-top:6px;">Admin login</h1>
    <div id="msg"></div>
    <form id="admin-login-form">
      <div class="field">
        <label for="password">Password</label>
        <div class="pw-wrap">
          <input id="password" type="password" required autocomplete="current-password">
          <button type="button" class="pw-toggle" aria-label="Show password" onclick="togglePw('password',this)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
      <button class="btn btn-primary btn-block" type="submit">Enter studio</button>
    </form>
  </div>
</main>

<script src="../js/app.js"></script>
<script>
  function togglePw(id, btn) {
    const inp = document.getElementById(id);
    const show = inp.type === 'password';
    inp.type = show ? 'text' : 'password';
    btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
    btn.innerHTML = show
      ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>'
      : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
  }

  function checkAlreadyAdmin() {
    if (SC.isAdmin()) {
      location.replace("dashboard.html");
    }
  }
  window.addEventListener('pageshow', checkAlreadyAdmin);
  checkAlreadyAdmin();

  document.getElementById('admin-login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const ok = await SC.adminLogin(document.getElementById('password').value);
    if (ok) location.replace("dashboard.html");
    else document.getElementById('msg').innerHTML = `<div class="error-msg">That password isn't right.</div>`;
  });
</script>

</body>
</html>
