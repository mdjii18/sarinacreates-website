<script>
  document.getElementById('yr').textContent = new Date().getFullYear();
  (async () => {
  const id = new URLSearchParams(location.search).get('id');
  const p = await SC.getProduct(id);
  const root = document.getElementById('product-root');

  if (!p) {
    root.innerHTML = `<div class="empty-state"><h3>We couldn't find that piece</h3><p><a class="btn btn-ghost" href="shop.html">Back to the shop</a></p></div>`;
  } else {
    root.innerHTML = `
      <div class="hero-grid" style="align-items:flex-start;">
        <div>
          <div class="hero-stage art-tile" id="main-stage" style="max-width:100%;">
            ${p.stock === 0 ? '<span class="badge sold">Sold</span>' : ''}
          </div>
          <div id="thumb-row" style="display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;"></div>
        </div>
        <div>
          <span class="eyebrow">${p.category}</span>
          <h1 style="font-size:2.2rem;">${p.name}</h1>
          <div class="price" style="font-size:1.3rem;margin-bottom:6px;">${SC.money(p.price)}</div>
          <div class="dims" style="margin-bottom:20px;">${p.dims}</div>
          <p style="max-width:44ch;color:#3a4a45;">${p.desc}</p>
          <p class="hint" style="margin-top:-4px;">${p.stock > 0 ? p.stock + ' in stock — each piece is one of a kind.' : 'This piece has sold — check the shop for similar ones.'}</p>
          <div id="add-area" style="margin-top:10px;"></div>
        </div>
      </div>`;

    const images = (p.images && p.images.length) ? p.images : (p.image ? [p.image] : []);
    const mainStage = document.getElementById('main-stage');
    const thumbRow = document.getElementById('thumb-row');

    function showImage(src) {
      if (src) {
        mainStage.querySelectorAll('.pour,.sheen,img').forEach(n => n.remove());
        mainStage.style.background = "#e4decd";
        mainStage.insertAdjacentHTML('beforeend', `<img src="${src}" alt="${p.name}" style="width:100%;height:100%;object-fit:cover;position:absolute;inset:0;"><div class="sheen"></div>`);
      } else {
        SC.paintTile(mainStage, p);
      }
    }

    if (images.length) {
      showImage(images[0]);
      thumbRow.innerHTML = images.map((src, i) => `
        <button type="button" data-thumb="${i}" style="width:64px;height:64px;padding:0;border:2px solid ${i===0 ? 'var(--teal-2)' : 'transparent'};border-radius:4px;overflow:hidden;cursor:pointer;background:none;">
          <img src="${src}" style="width:100%;height:100%;object-fit:cover;display:block;">
        </button>`).join('');
      thumbRow.querySelectorAll('[data-thumb]').forEach(btn => {
        btn.addEventListener('click', () => {
          showImage(images[parseInt(btn.getAttribute('data-thumb'), 10)]);
          thumbRow.querySelectorAll('[data-thumb]').forEach(b => b.style.borderColor = 'transparent');
          btn.style.borderColor = 'var(--teal-2)';
        });
      });
    } else {
      showImage(null);
    }

    const addArea = document.getElementById('add-area');
    if (p.stock > 0) {
      addArea.innerHTML = `
        <div style="display:flex;gap:12px;align-items:center;">
          <div class="qty">
            <button type="button" data-dec>−</button>
            <input type="text" value="1" readonly>
            <button type="button" data-inc>+</button>
          </div>
          <button class="btn btn-primary" id="add-btn">Add to cart</button>
        </div>
        <p class="success-msg" id="added-msg" style="display:none;margin-top:14px;">Added to your cart. <a href="cart.html" style="text-decoration:underline;">View cart →</a></p>`;
      let qty = 1;
      const input = addArea.querySelector('input');
      addArea.querySelector('[data-inc]').addEventListener('click', () => { qty = Math.min(p.stock, qty + 1); input.value = qty; });
      addArea.querySelector('[data-dec]').addEventListener('click', () => { qty = Math.max(1, qty - 1); input.value = qty; });
      document.getElementById('add-btn').addEventListener('click', async () => {
        await SC.addToCart(p.id, qty);
        SC.updateNav();
        document.getElementById('added-msg').style.display = 'block';
      });
    } else {
      addArea.innerHTML = `<a class="btn btn-ghost" href="shop.html">Browse available pieces</a>`;
    }
  }
  })();
</script>
