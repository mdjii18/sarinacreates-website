<script>
  document.getElementById('yr').textContent = new Date().getFullYear();
  (async () => {
  const id = new URLSearchParams(location.search).get('id');
  const order = await SC.getOrder(id);
  const root = document.getElementById('root');

  if (!order) {
    root.innerHTML = `<div class="empty-state"><h3>We couldn't find that order</h3><a class="btn btn-ghost" href="shop.html">Back to the shop</a></div>`;
  } else {
    root.innerHTML = `
      <span class="eyebrow">Order confirmed</span>
      <h1 style="font-size:2.1rem;">Thank you, ${order.customer.name.split(' ')[0]}.</h1>
      <p style="color:#3a4a45;max-width:48ch;">Your order <strong style="font-family:var(--mono);color:var(--teal);">${order.id}</strong> is confirmed. The studio will reach out at <strong>${order.customer.email}</strong> or <strong>${order.customer.phone}</strong> shortly to arrange payment before it ships.</p>

      <div class="cart-summary" style="margin-top:24px;">
        ${order.items.map(i => `<div class="summary-row"><span>${i.name} × ${i.qty}</span><span>${SC.money(i.price * i.qty)}</span></div>`).join('')}
        <div class="summary-row total"><span>Total</span><span>${SC.money(order.total)}</span></div>
      </div>

      <div style="display:flex;gap:14px;margin-top:26px;flex-wrap:wrap;">
        <a href="shop.html" class="btn btn-ghost">Keep browsing</a>
        <a href="account.html" class="btn btn-teal">View my orders</a>
      </div>`;
  }
  })();
</script>
