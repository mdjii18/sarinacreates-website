<script>
  document.getElementById('yr').textContent = new Date().getFullYear();
  (async () => {
  const user = SC.currentUser();
  const root = document.getElementById('root');

  if (!user) {
    root.innerHTML = `<div class="empty-state"><h3>You're not logged in</h3><p>Log in to see your past orders.</p><a class="btn btn-primary" href="login.html">Log in</a></div>`;
  } else {
    const orders = await SC.ordersForEmail(user.email);
    root.innerHTML = `
      <span class="eyebrow">My account</span>
      <h1 style="font-size:2rem;">Hi, ${user.name.split(' ')[0]}.</h1>
      <button class="btn btn-ghost btn-sm" id="logout">Log out</button>
      <h3 style="margin-top:38px;">Your orders</h3>
      ${orders.length ? `<table class="table"><thead><tr><th>Order</th><th>Date</th><th>Items</th><th>Total</th><th>Status</th></tr></thead><tbody>
        ${orders.map(o => `<tr>
          <td style="font-family:var(--mono);">${o.id}</td>
          <td>${new Date(o.createdAt).toLocaleDateString()}</td>
          <td>${o.items.map(i => i.name + ' ×' + i.qty).join(', ')}</td>
          <td>${SC.money(o.total)}</td>
          <td><span class="status-pill status-${o.status.toLowerCase()}">${o.status}</span></td>
        </tr>`).join('')}
      </tbody></table>` : `<p style="color:#3a4a45;">No orders yet — <a href="shop.html" style="color:var(--teal-2);text-decoration:underline;">browse the shop</a>.</p>`}
    `;
    document.getElementById('logout').addEventListener('click', () => { SC.logout(); location.href = "index.html"; });
  }
  })();
</script>
